name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install dependencies
        run: |
          pesde install

      - name: Setup lute
        run: |
          lute setup

      - name: Build
        run: |
          lute run build

      - name: Upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: plugin.rbxm
          generate_release_notes: true
          draft: true
